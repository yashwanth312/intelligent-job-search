<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>{{name}} - Resume</title>
<meta name="author" content="{{name}}">
<style>
  @page { margin: 0.5in; size: letter; }
  body {
    font-family: 'Calibri', 'Helvetica Neue', Arial, sans-serif;
    font-size: 10pt;
    color: #222;
    margin: 0;
    line-height: 1.35;
  }

  /* ── Header ── */
  h1 {
    font-size: 20pt;
    margin: 0 0 4px 0;
    text-align: center;
    color: #1F3864;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .contact {
    text-align: center;
    font-size: 9.5pt;
    color: #333;
    margin-bottom: 14px;
  }

  /* ── Section headings ── */
  h2 {
    font-size: 11pt;
    color: #1F3864;
    border-bottom: 1.5px solid #1F3864;
    padding-bottom: 2px;
    margin: 14px 0 6px 0;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 700;
  }

  /* ── Summary ── */
  .summary { font-size: 10pt; margin-bottom: 8px; text-align: justify; }

  /* ── Experience / Projects shared ── */
  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }
  .job-title { font-weight: 700; font-size: 10.5pt; color: #222; }
  .dates { font-size: 9.5pt; color: #555; white-space: nowrap; }

  /* Bullets are hanging-indent paragraphs, NOT <ul><li>. WeasyPrint flushes
     <li> markers to the end of the page as detached text runs, which corrupts
     the PDF reading order an ATS parses (measured on 619 resumes: the orphaned
     glyph run landed inside the Skills section in 97% of them). Carrying the
     marker as inline text keeps each bullet contiguous. Visual output is
     identical. See generation/ats.py and generation/pdf_renderer.py. */
  .bullet {
    margin: 0 0 2px 0;
    padding-left: 14px;
    text-indent: -14px;
    font-size: 10pt;
  }
  /* Absorbs the trailing margin the removed <ul> used to contribute, so
     inter-entry spacing matches the previous layout. */
  .experience { margin-bottom: 14px; }
  .project { margin-bottom: 12px; }
  .project-name { font-weight: 700; font-size: 10.5pt; color: #222; }

  /* ── Education ── */
  .edu-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
    font-size: 10pt;
  }
  .edu-left { font-weight: 700; }
  .nowrap { white-space: nowrap; }
  .edu-date { color: #555; white-space: nowrap; font-size: 9.5pt; }

  /* ── Skills (ATS-safe text rows — no tables) ── */
  .skills { margin: 2px 0 4px 0; }
  .skill-row { margin: 0 0 3px 0; font-size: 10pt; }
  .skill-cat { font-weight: 700; color: #222; }

  /* ── Certifications (ATS-safe text rows — no tables) ── */
  .certs { margin: 2px 0 4px 0; }
  .cert-row { margin: 0 0 3px 0; font-size: 10pt; }
  .cert-name { font-weight: 700; }

  /* ── Publications ── */
  .pub { margin-bottom: 6px; font-size: 10pt; }
  .pub-title { font-weight: 700; }
  .pub-venue { font-style: italic; color: #444; }

  strong { font-weight: 700; color: #222; }
</style></head><body>

<h1>{{name}}</h1>
<div class="contact">{{contact_line}}</div>

<h2>Summary</h2>
<div class="summary">{{summary}}</div>

<h2>Work Experience</h2>
{{experience}}

<h2>Education</h2>
{{education}}

<h2>Skills</h2>
<div class="skills">{{skills}}</div>

<h2>Certifications</h2>
<div class="certs">{{certifications}}</div>

<h2>Projects</h2>
{{projects}}

{{publications_section}}

</body></html>
