# target_companies.yaml
# Direct-ATS board tokens. Every entry responded 200 with at least one live
# posting when it was added.
#
#   greenhouse       https://boards-api.greenhouse.io/v1/boards/{token}/jobs
#   lever            https://api.lever.co/v0/postings/{token}
#   ashby            https://api.ashbyhq.com/posting-api/job-board/{token}
#   workday          {tenant}.{wd_server}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs
#
# Tokens are matched case-insensitively by these APIs — do not add a casing
# variant of a token already present, it just scrapes the same board twice.
# Quote any token that YAML would otherwise read as a number or a boolean
# ("8451", "Yes"); every consumer expects a string.
#
# Last expanded: 2026-09-13 — 268 -> ~1,190 boards. Direct ATS is the cheaper,
# fresher, less contested channel than LinkedIn (which supplied ~90% of
# applications in the 2026-04→09 cohort); see the "Seven Callbacks" audit.
#
# To grow the list:   python scripts/discover_ats_boards.py --limit 4000 --apply
# Workday tenants:    python scripts/promote_workday_candidates.py
# To re-verify:       python scripts/verify_greenhouse_tokens.py
#                     python scripts/verify_lever_ashby_tokens.py

