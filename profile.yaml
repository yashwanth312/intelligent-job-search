publications:
  - title: "Real Time Door Unlocking System using Facial Biometrics based on IoT and Python"
    venue: "2023 IEEE International Students' Conference on Electrical, Electronics and Computer Science (SCEECS)"
    venue_short: "IEEE SCEECS 2023"
    date: "February 2023"
    pages: "1-5"
    doi: "10.1109/SCEECS57921.2023.10063142"
    url: "https://ieeexplore.ieee.org/document/10063142"
    authorship: "First Author and Corresponding Author"
    affiliation: "Maulana Azad National Institute of Technology (NIT), Bhopal — Department of Electrical Engineering"
    keywords: ["IoT", "AI", "facial recognition", "LBPH", "security", "smart home"]
    raw_context: |
      First-author and corresponding-author IEEE-published research at the 2023
      IEEE International Students' Conference on Electrical, Electronics and
      Computer Science (SCEECS), pp. 1-5, DOI 10.1109/SCEECS57921.2023.10063142.
      Conducted at NIT Bhopal, Department of Electrical Engineering.
      Designed and built an end-to-end IoT biometric door access system replacing
      traditional key locks with facial authentication. User looks at the camera;
      device authenticates against preregistered face dataset and physically
      unlocks the door, or on failure captures the intruder's image and emails
      it to the owner over SMTP with TLS.
      Algorithms: Haar cascade frontal-face detector for face localization
      (grayscale, OpenCV) followed by Local Binary Pattern Histogram (LBPH) for
      recognition. LBPH parameters: radius=1, 8 sample points, 8x8 grid. Chose
      LBPH over LDA, PCA, and DCT after comparative analysis for low-light
      robustness, minimum noise interference, and superior confidence factor on
      a microcontroller compute budget.
      Hardware: ESP32-CAM (240 MHz, 600 DMIPS, onboard controller running
      inference at the edge with SD-card image storage), Arduino (ATmega328P)
      for control logic, FTDI programmer for serial-to-USB bridging, 5V relay
      module driving a 12V DC solenoid lock (2000 N locking force, 40 N
      latching), buzzer for local alerting.
      Software: Python with PySerial for the Python-to-Arduino bridge, Arduino
      IDE for embedded firmware, OpenCV for Haar cascade and LBPH, smtplib over
      TLS for intruder-alert emails (SMTP per RFC 5321 with STARTTLS per
      RFC 3207).
      Workflow: edge image capture -> grayscale preprocess -> Haar cascade
      detection -> LBPH histogram comparison vs. preregistered set -> on match,
      relay HIGH, solenoid retracts, door unlocks; on mismatch, intruder image
      saved to ESP32-CAM SD card and emailed to owner via SMTP/TLS with image
      attachment.
      Results reported in paper: ~88% confidence rate on preregistered-face
      authentication; end-to-end intruder-alert pipeline validated.
      Keywords (paper): IoT, AI, facial recognition, LBPH, security, smart home.
      Role: first author and corresponding author — led system design, hardware
      integration, Python/embedded software implementation, experimental
      validation, and paper authorship.
    framings:
      security:
        bullets:
          - "First-authored an IEEE-published biometric access control system (SCEECS 2023, DOI 10.1109/SCEECS57921.2023.10063142) replacing traditional door locks with facial authentication, addressing the 58.3% forcible-entry burglary rate cited in FBI statistics."
          - "Engineered an automated intruder-alert pipeline that captures unauthorized faces and notifies the owner over SMTP with TLS encryption (RFC 5321 / RFC 3207 STARTTLS), hardening the device against eavesdropping and tampering."
          - "Designed the complete authentication pipeline — Haar cascade detection plus LBPH recognition with tuned parameters (radius=1, 8 sample points, 8x8 grid) — chosen over LDA, PCA, and DCT after comparative analysis for low-light robustness and minimum noise interference."
      ai_ml:
        bullets:
          - "First-authored and corresponding-authored an IEEE computer vision publication (SCEECS 2023) deploying Haar cascade face detection and Local Binary Pattern Histogram (LBPH) recognition in Python/OpenCV, achieving ~88% match confidence on preregistered-face authentication."
          - "Performed comparative algorithm evaluation across LBPH, LDA, PCA, and DCT, selecting LBPH for its superior low-light performance, minimum noise interference, and deployable compute footprint on a 240 MHz edge microcontroller."
          - "Implemented an end-to-end real-time face recognition pipeline running inference directly on the ESP32-CAM's onboard controller — eliminating the need for an external Raspberry Pi or cloud inference."

